# Creates paid resources only when YOU apply this Blueprint in Render.
services:
  - type: web
    name: taiho-construction
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate --noinput
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: taiho-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
databases:
  - name: taiho-db
    plan: 0.1c-256mb
    databaseName: taiho
    user: taiho
    postgresMajorVersion: "16"
    ipAllowList: []
