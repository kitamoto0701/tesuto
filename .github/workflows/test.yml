name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py test && python manage.py makemigrations --check --dry-run
        env:
          DEBUG: '1'
          SECRET_KEY: ci-only-not-a-production-secret-0123456789-abcdefghijklmnop
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: taiho
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py test && python manage.py migrate --noinput
        env:
          DEBUG: '1'
          SECRET_KEY: ci-only-not-a-production-secret-0123456789-abcdefghijklmnop
          DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/taiho
          DB_SSLMODE: disable
